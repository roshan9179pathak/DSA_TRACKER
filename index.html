<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      div {
        text-align: center;
        text-decoration: underline;
      }
      p::selection {
        color: red;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        border: 2px solid black;
        outline: solid red;
        width: 400px;
        height: 400px;
      "
    ></div>

    <p>The selected area will be red.</p>
  </body>
</html>
